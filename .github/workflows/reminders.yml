# Sends due payment reminders once a day.
#
# The server also runs the job every 30 minutes while it's awake, but a free Render
# instance sleeps when idle. This wakes it and runs the job.
#
# Set up (repo → Settings → Secrets and variables → Actions):
#   TASKX_API_URL  https://taskx-backend-90ns.onrender.com
#   CRON_SECRET    the same value as CRON_SECRET on the server
name: Payment reminders

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC every day
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the reminder job
        env:
          API: ${{ secrets.TASKX_API_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API" ] || [ -z "$SECRET" ]; then
            echo "Set the TASKX_API_URL and CRON_SECRET secrets to turn this on."; exit 0
          fi
          # A sleeping server takes up to a minute to start.
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 "$API/health"
          echo
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 300 \
            -X POST -H "Authorization: Bearer $SECRET" "$API/api/cron/reminders"
          echo
